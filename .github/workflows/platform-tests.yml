name: Platform compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONPATH: tests
      TIKTOKEN_CACHE_DIR: .pilot-state/platform-tokenizer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.14.0'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache: false
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - name: Cache the tokenizer before starting test workers
        run: python -c "import numpy, tiktoken; tiktoken.get_encoding('cl100k_base')"
      - name: Verify native setup and managed virtual environment
        env:
          OCE_CONFIG_HOME: .pilot-state/platform-setup
          EMBEDDING_BASE_URL: https://embedding.example.invalid/v1
          EMBEDDING_API_KEY: test-only
          EMBEDDING_MODEL: test-only
          OCE_EMBEDDING_DIMENSIONS: '1024'
          RERANK_BASE_URL: https://rerank.example.invalid/v1
          RERANK_API_KEY: test-only
          RERANK_MODEL: test-only
        run: node bin/opencontextengine.mjs setup --non-interactive
      - name: Verify installed runtime
        env:
          OCE_CONFIG_HOME: .pilot-state/platform-setup
        run: node bin/opencontextengine.mjs doctor
      - name: Verify package contents
        run: npm pack --dry-run --ignore-scripts
      - name: Runtime, Unicode paths, HTTP, and MCP regression tests
        env:
          OCE_PYTHON: python
        run: node --test tests/setup.test.mjs tests/remote-models.test.mjs tests/platform.test.mjs tests/workspaces.test.mjs tests/live-http.test.mjs tests/mcp.test.mjs tests/shared-service.test.mjs
      - name: File locks, live indexing, JavaScript, and Go regression tests
        run: python -m unittest background_process_test http_server_test shared_worker_test writer_lock_test go_helper_test file_scan_test live_test js_go_test go_types_test reranker_test text_fallback_test
